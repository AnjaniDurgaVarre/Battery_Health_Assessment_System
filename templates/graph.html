<!DOCTYPE html>
<html lang="en">

<head>

    <title>Graphs</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header>
    <h1>Battery Health Assessment & Dynamic Allocation System</h1>
</header>

<nav>
    <a href="/">🏠 Home</a>
    <a href="/dataset">📂 Dataset</a>
    <a href="/vehicle_search">🚗 Vehicle Search</a>
    <a href="/recommendation">🔋 Recommendation</a>
    <a href="/dashboard">📊 Dashboard</a>
    <a href="/graphs">📈 Graphs</a>
    <a href="/reports">📄 Reports</a>
</nav>

<div class="container mt-4">

    <h2 class="text-center mb-4">
        📊 Battery Performance Dashboard
    </h2>

    <div class="row">

        <!-- SoC -->
        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="text-center mb-3">SoC Comparison</h5>

                    <div style="height:220px;">
                        <canvas id="socChart"></canvas>
                    </div>

                </div>
            </div>
        </div>

        <!-- SoH -->
        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="text-center mb-3">SoH Comparison</h5>

                    <div style="height:220px;">
                        <canvas id="sohChart"></canvas>
                    </div>

                </div>
            </div>
        </div>

        <!-- Temperature -->
        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="text-center mb-3">Temperature Trend</h5>

                    <div style="height:220px;">
                        <canvas id="tempChart"></canvas>
                    </div>

                </div>
            </div>
        </div>

        <!-- Battery Status -->
        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="text-center mb-3">Battery Status</h5>

                    <div style="height:220px;">
                        <canvas id="statusChart"></canvas>
                    </div>

                </div>
            </div>
        </div>

    </div>

</div>
<script>

// ----------- SoC Comparison -----------

new Chart(document.getElementById("socChart"), {

    type: "line",

    data: {

        labels: ["Vehicle Requirement", "Allocated Battery"],

        datasets: [{

            label: "SoC (%)",

            data: [

                {{ vehicle_soc|default(0) }},

                {{ battery_soc|default(0) }}

            ],

            borderColor: "blue",

            backgroundColor: "rgba(0,0,255,0.2)",

            fill: false,

            tension: 0.3

        }]

    },

    options: {

        responsive: true,

        maintainAspectRatio: false,

        plugins: {
             legend: {
               display: false
            }
        },

        scales: {

            y: {

                beginAtZero: true,

                max: 100

            }

        }

    }

});

// ----------- Battery SoH Trend -----------

new Chart(document.getElementById("sohChart"), {

    type: "line",

    data: {

        labels: {{ battery_ids|tojson }},

        datasets: [{

            label: "Battery SoH (%)",

            data: {{ battery_soh|tojson }},

            borderColor: "green",

            backgroundColor: "rgba(0,128,0,0.2)",

            fill: false,

            tension: 0.3

        }]

    },

    options: {

        responsive: true,

        maintainAspectRatio: false,

         plugins: {
             legend: {
                 display: false
             }
        },


        scales: {

            y: {

                beginAtZero: true,

                max: 100

            }

        }

    }

});
// ----------- Temperature Graph -----------

new Chart(document.getElementById("tempChart"), {

    type: "line",

    data: {

        labels: {{ battery_ids|tojson }},

        datasets: [{

            label: "Temperature (°C)",

            data: {{ battery_temp|tojson }},

            borderColor: "red",

            backgroundColor: "rgba(255,0,0,0.2)",

            fill: false,

            tension: 0.3

        }]

    },

    options: {

        responsive: true,

        maintainAspectRatio: false

    }

});
// ----------- Battery Status Graph -----------

new Chart(document.getElementById("statusChart"), {

    type: "bar",

    data: {

        labels: ["Available", "Allocated", "Maintenance"],

        datasets: [{

            label: "Battery Status",

            data: [

                {{ available }},

                {{ allocated }},

                {{ maintenance }}

            ],

            backgroundColor: [

                "green",

                "blue",

                "red"

            ]

        }]

    },

    options: {

        responsive: true,

        maintainAspectRatio: false,

         plugins: {
             legend: {
                 display: false
             }
        },


        scales: {

            y: {

                beginAtZero: true

            }

        }

    }

});

</script>

</body>

</html>
